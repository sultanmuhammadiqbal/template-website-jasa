name: Website checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/tahap-2-layanan-portofolio]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check scripts/check-site.mjs
          node --check scripts/test-menu.mjs
          node --check scripts/test-stage2.mjs
      - name: Run all tests
        run: npm test
